name: toplog

services:
  db:
    image: postgres:18-alpine
    container_name: toplog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-blogdb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecurepassword123}
    ports:
      - "5432:5432"
    volumes:
      - toplog_pg_data:/var/lib/postgresql
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=4MB"
      - "-c"
      - "random_page_cost=1.1"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-blogdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - toplog-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: toplog-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.app
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DB_NAME:-blogdb}
      DATABASE_USER: ${DB_USER:-postgres}
      DATABASE_PASSWORD: ${DB_PASSWORD:-supersecurepassword123}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-replace-with-a-random-32-char-string-in-prod}
      JWT_ISSUER: ${JWT_ISSUER:-blogs-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-blogs-console}
      STORAGE_UPLOADS_DIR: /app/uploads
      APP_BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
    volumes:
      - toplog_uploads_data:/app/uploads
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - toplog-net

  console:
    build:
      context: ./console
      dockerfile: Dockerfile
    container_name: toplog-console
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.app
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://backend:8080
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - toplog-net

  caddy:
    image: caddy:2-alpine
    container_name: toplog-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env.app
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:-console.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - toplog_caddy_data:/data
      - toplog_caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    depends_on:
      backend:
        condition: service_healthy
      console:
        condition: service_healthy
    networks:
      - toplog-net

volumes:
  toplog_pg_data:
  toplog_uploads_data:
  toplog_caddy_data:
  toplog_caddy_config:

networks:
  toplog-net:
    driver: bridge
