ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
    }
    application {
        modules = [ com.app.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/blogdb"
    url = ${?DATABASE_URL}
    user = "postgres"
    user = ${?DATABASE_USER}
    password = "postgres"
    password = ${?DATABASE_PASSWORD}
    poolSize = 10
    poolSize = ${?DATABASE_POOL_SIZE}
}

jwt {
    secret = "super-secret-key-change-me-in-production-min-32-chars"
    secret = ${?JWT_SECRET}
    issuer = "blogs-backend"
    issuer = ${?JWT_ISSUER}
    audience = "blogs-console"
    audience = ${?JWT_AUDIENCE}
    realm = "Blogs"
    realm = ${?JWT_REALM}
    expirationMs = 86400000
    expirationMs = ${?JWT_EXPIRATION_MS}
}

storage {
    uploadsDir = "uploads"
    uploadsDir = ${?STORAGE_UPLOADS_DIR}
}

app {
    baseDomain = "localhost"
    baseDomain = ${?APP_BASE_DOMAIN}
    supportedLanguages = "en,th"
    supportedLanguages = ${?SUPPORTED_LANGUAGES}
}

ai {
    apiKey = ${?AI_API_KEY}
    openrouterApiKey = ${?OPENROUTER_API_KEY}
    baseUrl = ${?AI_BASE_URL}
    model = ${?AI_MODEL}
}
